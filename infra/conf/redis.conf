requirepass mysecretpass

bind 0.0.0.0
port 6379
tcp-keepalive 60

appendonly yes
appendfsync everysec
dir /data

save 900 1
save 300 10
save 60 10000

# maxmemory 4gb
maxmemory-policy allkeys-lru

aclfile /etc/redis/readonly.acl

loglevel notice
logfile ""

slowlog-log-slower-than 10000
slowlog-max-len 128
